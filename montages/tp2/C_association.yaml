# GÉNÉRÉ par un script de session puis relu : YAML = source de vérité. Placement = proposition (sens a-e/f-j, rangée 1 en bas, bus haut : à confirmer sur la plaque).
id: tp2-C-association
tp: 2
titre: 'C. Association : non inverseur (×10) puis inverseur (×−20) → Av ≈ −200'
objectif: Ve = 40 mVpp, 1 kHz -> Vs ≈ 8 Vpp. fc théorique ≈ GBP/Av(1 étage le plus limitant) ; compare aux mesures.
plaque: wish_board_106
puces:
- ref: U1
  modele: TL081
  bloc: T1
  rangee_broche1: 50
  encoche: haut
- ref: U2
  modele: TL081
  bloc: T2
  rangee_broche1: 50
  encoche: haut
composants:
  R1:
    type: resistor
    ohm: 1000
    etiquette: 1 kΩ
    a: T1g49
    b: T1g53
  R2:
    type: resistor
    ohm: 9100
    etiquette: 9,1 kΩ
    a: T1e53
    b: T1e48
  R3:
    type: resistor
    ohm: 1000
    etiquette: 1 kΩ
    a: T2f53
    b: T2h49
  R4:
    type: resistor
    ohm: 20000
    etiquette: 20 kΩ
    a: T2e53
    b: T2e48
fils:
- n: 1
  de: BNC1.core
  vers: T1f48
  couleur: rouge
  role: Ve sur la broche 3 de U1
- n: 2
  de: BNC1.shield
  vers: TOP-L1-3
  couleur: noir
  role: blindage BNC 1 -> masse
- n: 3
  de: BNC2.core
  vers: T2c48
  couleur: orange
  role: Vs (sortie de U2) vers la voie 2
- n: 4
  de: BNC2.shield
  vers: TOP-L1-4
  couleur: noir
  role: blindage BNC 2 -> masse
- n: 5
  de: T1f49
  vers: T1d53
  couleur: jaune
  role: 'U1 : broche 2 vers R2'
- n: 6
  de: T1h53
  vers: TOP-L1-6
  couleur: noir
  role: 'U1 : bas de R1 à la masse'
- n: 7
  de: T1b49
  vers: N2-1u-49
  couleur: rouge
  role: U1 broche 7 → +15 V
- n: 8
  de: T1i47
  vers: N1-1u-47
  couleur: bleu
  role: U1 broche 4 → −15 V
- n: 9
  de: T1c48
  vers: T2g53
  couleur: vert
  role: sortie de U1 (broche 6) vers R3, entrée de l'étage inverseur
- n: 10
  de: T2f49
  vers: T2d53
  couleur: jaune
  role: 'U2 : broche 2 vers R4'
- n: 11
  de: T2g48
  vers: TOP-L1-7
  couleur: noir
  role: 'U2 : broche 3 à la masse'
- n: 12
  de: T2i47
  vers: N2-2u-47
  couleur: bleu
  role: U2 broche 4 → −15 V (rail N2 colonne 2)
- n: 13
  de: T2b49
  vers: N3-1u-49
  couleur: rouge
  role: U2 broche 7 → +15 V (rail N3 colonne 1)
- n: 14
  de: VC.main
  vers: N2-1u-62
  couleur: rouge
  role: '+15 V : douille VC vers rail N2 col. 1'
- n: 15
  de: VB.main
  vers: N1-1u-62
  couleur: bleu
  role: '−15 V : douille VB vers rail N1 col. 1'
- n: 16
  de: N1-1u-61
  vers: N2-2u-61
  couleur: bleu
  role: relie le rail −15 V (N1) au rail N2 colonne 2
- n: 17
  de: N2-1u-60
  vers: N3-1u-60
  couleur: rouge
  role: relie le rail +15 V (N2) au rail N3
- n: 18
  de: MASSE.main
  vers: TOP-L1-1
  couleur: turquoise
  role: '0 V : douille MASSE vers bus haut'
cables:
- id: A
  nom: BNC–BNC
  de: gbf.out1
  vers: BNC1
  role: GBF -> plaque (signal Ve)
- id: B
  nom: BNC–BNC depuis le T
  de: gbf.out1
  vers: scope.ch1
  role: dérivation du GBF -> voie 1 (affiche Ve)
  via: T
- id: C
  nom: BNC–BNC
  de: scope.ch2
  vers: BNC2
  role: voie 2 de l'oscillo <- plaque (Vs)
- id: D
  nom: câble banane
  de: psu.ch2_plus
  vers: VC
  role: +15 V (voie 2 +) -> douille VC (rouge)
- id: E
  nom: câble banane
  de: psu.ch3_moins
  vers: VB
  role: −15 V (voie 3 −) -> douille VB (bleue)
- id: F
  nom: câble banane
  de: psu.ch2_moins
  vers: MASSE
  role: 0 V (voie 2 −) -> douille MASSE (⏚)
- id: G
  nom: strap banane
  type: strap
  de: psu.ch2_moins
  vers: psu.ch3_plus
  role: 'relie voie 2 − à voie 3 + : c''est ce point commun qui devient le 0 V'
tee:
  sur: gbf.out1
  statut: a_confirmer
  preuve: adaptateur chromé sur la sortie 1 du GBF ; 2 BNC seulement sur la plaque pour 3 liaisons
noeuds:
  VE:
  - BNC1.core
  - T1f48
  - U1.3
  INV1:
  - R1.a
  - R2.a
  - U1.2
  - T1f49
  - T1d53
  S1:
  - U1.6
  - R2.b
  - T1c48
  - R3.a
  - T2f53
  - T2g53
  INV2:
  - R3.b
  - R4.a
  - U2.2
  - T2f49
  - T2d53
  VS:
  - U2.6
  - R4.b
  - BNC2.core
  - T2c48
  VPLUS:
  - U1.7
  - U2.7
  - VC.main
  - N3-1u-60
  VMOINS:
  - U1.4
  - U2.4
  - VB.main
  - N2-2u-47
  GND:
  - BNC1.shield
  - BNC2.shield
  - TOP-L1-3
  - TOP-L1-4
  - R1.b
  - T1h53
  - U2.3
  - T2g48
  - TOP-L1-7
  - MASSE.main
etapes_montage:
- 'Garde le B2 (U1 non inverseur) tel quel : R1, R2, fils 1-8 inchangés, mais BNC2 quitte U1.'
- Pose U2 dans le bloc T2, encoche en haut, broche 1 en T2j50.
- 'Fil 9 : sortie de U1 (T1c48) vers R3 (T2g53, même rangée que T2f53). R3 : T2f53 → T2h49 ; R4 : T2e53 → T2e48 ; fil 10 : T2f49 → T2d53 ; fil 11 : broche 3 de U2 à la masse.'
- 'Alim de U2 : fils 12 et 13, puis liens de rail 16 et 17 (sinon U2 n''est pas alimenté).'
- 'BNC2 sur T2c48 (sortie de U2). Ve = 40 mVpp : Vs = 40 mV × 10,1 × 20 ≈ 8 Vpp.'
precedent: montages/tp2/B2_non_inverseur.yaml
instruments:
  psu:
    photo: psu_ports
    reglages: Voie 2 = +15,0 V · voie 3 = 15,0 V (sa borne + au 0 V donne −15 V) · limite de courant 0,05 A · sorties ON seulement APRÈS câblage
    etapes:
    - n: 1
      cible: ch2_plus
      texte: 'Voie 2 : régler 15 V, limite 0,05 A'
    - n: 2
      cible: ch3_plus
      texte: 'Voie 3 : 15 V, limite 0,05 A ; sa borne + est reliée à la borne − de la voie 2 (strap G)'
    - n: 3
      cible: ch3_moins
      texte: −15 V = borne − de la voie 3, vers VB
    - n: 4
      cible: btn_on_2
      texte: Allumer voie 2 puis voie 3 (ON). Vérifier à l'écran +15,00 V et 15,00 V
  gbf:
    photo: gbf_ports
    reglages: Sinus · 40 mVpp · 1 kHz · High Z
    etapes:
    - n: 1
      cible: btn_waveform
      texte: Waveform puis la forme voulue
    - n: 2
      cible: btn_parameter
      texte: 'Parameter : Frequency / Amplitude / Offset'
    - n: 3
      cible:
      - keypad_1
      - keypad_0
      - keypad_dot
      texte: 'Pavé : 1 kHz, 40 mVpp (0.04 V)'
    - n: 4
      cible: btn_ch1_setup
      texte: 'Setup (Channel 1) : charge High Z — chemin exact à vérifier sur l''appareil'
    - n: 5
      cible: btn_ch1_onoff
      texte: 'On/Off (Channel 1) : ON'
  scope:
    photo: scope_front
    reglages: 'Voie 1 : 20 mV/div · voie 2 : 2 V/div · 200 µs/div'
    etapes:
    - n: 1
      cible: btn_default_setup
      texte: Default Setup
    - n: 2
      cible:
      - btn_ch1
      - btn_ch2
      texte: Voies 1 et 2 allumées, couplage DC, sonde 1:1
    - n: 3
      cible: knob_horiz
      texte: Base de temps selon le montage
    - n: 4
      cible: btn_trig_menu
      texte: 'Trigger : source voie 1, front montant'
    - n: 5
      cible: btn_meas
      texte: 'Meas : Cr-cr voies 1 et 2, fréquence ; curseurs si besoin'
pannes:
- 'Vs écrêtée : Ve trop grand (max ≈ 60 mVpp pour Av = −200).'
- 'Vs = 0 : U2 non alimenté (liens 16 et 17 oubliés) ou sortie de U1 pas reliée (fil 9).'
- 'Pas de signal sur la voie 1 : T du GBF absent.'
