# GÉNÉRÉ par un script de session puis relu : YAML = source de vérité. Placement = proposition (sens a-e/f-j, rangée 1 en bas, bus haut : à confirmer sur la plaque).
id: tp3-C-compteur
tp: 3
titre: C. Compteur binaire 2 bits (montage de gauche, fig. 3) avec LEDs
objectif: 'Q0 = CLK/2, Q1 = CLK/4 ; LED sur Q0 et sur Q1 ; fronts descendants zoomés : asynchrone.'
plaque: wish_board_106
puces:
- ref: U1
  modele: 74LS74
  bloc: T1
  rangee_broche1: 50
  encoche: haut
composants:
  R0:
    type: resistor
    ohm: 330
    etiquette: 330 Ω
    a: T1h46
    b: T1h52
  LED0:
    type: led
    etiquette: LED Q0
    a: T1i52
    k: T1i56
  R1:
    type: resistor
    ohm: 330
    etiquette: 330 Ω
    a: T1d45
    b: T1d52
  LED1:
    type: led
    etiquette: LED Q1
    a: T1c52
    k: T1c56
fils:
- n: 1
  de: BNC1.core
  vers: T1g48
  couleur: rouge
  role: âme du BNC 1 (Ve du GBF)
- n: 2
  de: BNC1.shield
  vers: TOP-L1-3
  couleur: noir
  role: blindage BNC 1 -> masse
- n: 3
  de: BNC2.core
  vers: T1i46
  couleur: orange
  role: âme du BNC 2 (Vs vers voie 2)
- n: 4
  de: BNC2.shield
  vers: TOP-L1-4
  couleur: noir
  role: blindage BNC 2 -> masse
- n: 5
  de: T1f50
  vers: N1-1u-50
  couleur: rouge
  role: CLR1 (broche 1) à +5 V
- n: 6
  de: T1f47
  vers: N1-1u-47
  couleur: rouge
  role: PRE1 (broche 4) à +5 V
- n: 7
  de: T1g49
  vers: T1g45
  couleur: jaune
  role: D1 (broche 2) ← Q̄0 (broche 6)
- n: 8
  de: T1h45
  vers: T1c47
  couleur: vert
  role: 'Q̄0 (broche 6) → CLK2 (broche 11) : c''est la cascade'
- n: 9
  de: T1b44
  vers: T1b48
  couleur: jaune
  role: D2 (broche 12) ← Q̄1 (broche 8)
- n: 10
  de: T1b49
  vers: N2-1u-49
  couleur: rouge
  role: CLR2 (broche 13) à +5 V
- n: 11
  de: T1b46
  vers: N2-1u-46
  couleur: rouge
  role: PRE2 (broche 10) à +5 V
- n: 12
  de: T1b50
  vers: N2-1u-50
  couleur: rouge
  role: broche 14 (VCC) vers +5 V
- n: 13
  de: T1f44
  vers: TOP-L1-5
  couleur: noir
  role: broche 7 (GND) vers 0 V
- n: 14
  de: T1h56
  vers: TOP-L1-6
  couleur: noir
  role: cathode LED0 à la masse
- n: 15
  de: T1d56
  vers: TOP-L1-7
  couleur: noir
  role: cathode LED1 à la masse
- n: 16
  de: VC.main
  vers: N2-1u-62
  couleur: rouge
  role: '+5 V : douille VC vers rail N2 col. 1'
- n: 17
  de: N2-1u-61
  vers: N1-1u-61
  couleur: rouge
  role: lien du rail +5 V N2 vers N1
- n: 18
  de: MASSE.main
  vers: TOP-L1-1
  couleur: turquoise
  role: '0 V : douille MASSE vers bus haut'
cables:
- id: A
  nom: BNC–BNC
  de: gbf.sync_out
  vers: BNC1
  role: SYNC -> CLK de la bascule 1
- id: B
  nom: BNC–BNC depuis le T
  de: gbf.sync_out
  vers: scope.ch1
  via: T
  role: 'voie 1 : horloge'
- id: C
  nom: BNC–BNC
  de: scope.ch2
  vers: BNC2
  role: 'voie 2 : Q0 (puis Q1)'
- id: D
  nom: câble banane
  de: psu.ch1_plus
  vers: VC
  role: +5 V (voie 1 +) -> douille VC
- id: E
  nom: câble banane
  de: psu.ch1_moins
  vers: MASSE
  role: 0 V (voie 1 −) -> douille MASSE
tee:
  sur: gbf.sync_out
  statut: a_confirmer
  preuve: T sur SYNC ; sinon une sonde sur la broche 3
noeuds:
  CLK:
  - BNC1.core
  - T1g48
  - U1.3
  Q0:
  - U1.5
  - BNC2.core
  - T1i46
  - R0.a
  - T1h46
  QB0:
  - U1.6
  - U1.2
  - T1g49
  - T1g45
  - T1h45
  - T1c47
  - U1.11
  Q1:
  - U1.9
  - R1.a
  - T1d45
  QB1:
  - U1.8
  - U1.12
  - T1b44
  - T1b48
  VCC:
  - U1.14
  - U1.1
  - U1.4
  - U1.10
  - U1.13
  - VC.main
  - N1-1u-50
  - N1-1u-47
  - N2-1u-49
  - N2-1u-46
  - N2-1u-50
  GND:
  - U1.7
  - T1f44
  - TOP-L1-5
  - BNC1.shield
  - BNC2.shield
  - TOP-L1-3
  - TOP-L1-4
  - LED0.k
  - T1h56
  - TOP-L1-6
  - LED1.k
  - T1d56
  - TOP-L1-7
  - MASSE.main
  - TOP-L1-1
etapes_montage:
- 'Pars du B : garde alim, CLR1, PRE1, fil D1←Q̄0, LED0.'
- 'Ajoute la 2e bascule : CLR2 (b.13) et PRE2 (b.10) à +5 V (fils 10, 11).'
- 'Fil 8 : Q̄0 (b.6) → CLK2 (b.11). Fil 9 : D2 (b.12) ← Q̄1 (b.8). LED1 sur Q1 (b.9) avec R1 330 Ω.'
- Voie 2 sur Q0 (T1i46) puis déplace BNC2.core sur Q1 (T1c45) ; compte 00→01→10→11 avec les LEDs (Q1 Q0).
- 'Zoom sur les fronts descendants (20 ns/div) : Q1 retarde sur Q0 → montage ASYNCHRONE.'
precedent: montages/tp3/B_bascule_D.yaml
instruments:
  psu:
    photo: psu_ports
    reglages: Voie 1 = 5,00 V (6 V max) · limite 0,1 A · ON après câblage
    etapes:
    - n: 1
      cible: ch1_plus
      texte: 'Voie 1 : régler 5,00 V, limite de courant 0,1 A'
    - n: 2
      cible: btn_on_1
      texte: 'ON : lire 5,00 V à l''écran'
  gbf:
    photo: gbf_ports
    reglages: Carré TTL SYNC · 1 kHz (puis 1 Hz pour voir compter les LEDs)
    etapes:
    - n: 1
      cible: btn_waveform
      texte: Waveform puis la forme voulue
    - n: 2
      cible: btn_parameter
      texte: 'Parameter : Frequency / Amplitude / Offset'
    - n: 3
      cible:
      - keypad_1
      - keypad_0
      - keypad_dot
      texte: 'Pavé : 1 kHz ; pour les LEDs : 1 Hz'
    - n: 4
      cible: btn_ch1_setup
      texte: 'Setup (Channel 1) : charge High Z — chemin exact à vérifier sur l''appareil'
    - n: 5
      cible: btn_ch1_onoff
      texte: 'On/Off (Channel 1) : ON'
  scope:
    photo: scope_front
    reglages: 'Voie 1 : 2 V/div (CLK) · voie 2 : 2 V/div (Q0, puis Q1) · 1 ms/div'
    etapes:
    - n: 1
      cible: btn_default_setup
      texte: Default Setup
    - n: 2
      cible:
      - btn_ch1
      - btn_ch2
      texte: Voies 1 et 2 allumées, couplage DC, sonde 1:1
    - n: 3
      cible: knob_horiz
      texte: Base de temps selon le montage
    - n: 4
      cible: btn_trig_menu
      texte: 'Trigger : source voie 1, front montant'
    - n: 5
      cible: btn_meas
      texte: 'Meas : Cr-cr voies 1 et 2, fréquence ; curseurs si besoin'
pannes:
- 'Q1 ne bouge pas : fil 8 (cascade) absent, ou PRE2/CLR2 (b.10, b.13) non reliés au +5 V.'
- 'Compte à l''envers (11→10→01) : lecture Q0/Q1 inversée ou câblé sur Q au lieu de Q̄.'
- 'LED fixe : horloge trop rapide (> 20 Hz) → la LED paraît allumée en continu.'
