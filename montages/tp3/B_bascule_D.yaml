# GÉNÉRÉ par un script de session puis relu : YAML = source de vérité. Placement = proposition (sens a-e/f-j, rangée 1 en bas, bus haut : à confirmer sur la plaque).
id: tp3-B-bascule-D
tp: 3
titre: 'B. Bascule D 74LS74 (D = Q̄ : diviseur par 2, retard de propagation)'
objectif: Horloge = SYNC du GBF sur CLK ; Q sur la voie 2 et sur une LED ; mesure du tpd entre front montant de CLK et front de Q.
plaque: wish_board_106
puces:
- ref: U1
  modele: 74LS74
  bloc: T1
  rangee_broche1: 50
  encoche: haut
composants:
  R:
    type: resistor
    ohm: 330
    etiquette: 330 Ω (orange-orange-marron)
    a: T1h46
    b: T1h52
  LED:
    type: led
    etiquette: LED (patte longue = anode)
    a: T1i52
    k: T1i56
fils:
- n: 1
  de: BNC1.core
  vers: T1g48
  couleur: rouge
  role: âme du BNC 1 (Ve du GBF)
- n: 2
  de: BNC1.shield
  vers: TOP-L1-3
  couleur: noir
  role: blindage BNC 1 -> masse
- n: 3
  de: BNC2.core
  vers: T1i46
  couleur: orange
  role: âme du BNC 2 (Vs vers voie 2)
- n: 4
  de: BNC2.shield
  vers: TOP-L1-4
  couleur: noir
  role: blindage BNC 2 -> masse
- n: 5
  de: T1f50
  vers: N1-1u-50
  couleur: rouge
  role: 'CLR (broche 1) à +5 V : sinon la bascule reste à 0'
- n: 6
  de: T1f47
  vers: N1-1u-47
  couleur: rouge
  role: PRE (broche 4) à +5 V
- n: 7
  de: T1g49
  vers: T1g45
  couleur: jaune
  role: 'D (broche 2) reliée à Q̄ (broche 6) : diviseur par 2'
- n: 8
  de: T1b50
  vers: N2-1u-50
  couleur: rouge
  role: broche 14 (VCC) vers +5 V
- n: 9
  de: T1f44
  vers: TOP-L1-5
  couleur: noir
  role: broche 7 (GND) vers 0 V
- n: 10
  de: T1h56
  vers: TOP-L1-6
  couleur: noir
  role: cathode de la LED à la masse
- n: 11
  de: VC.main
  vers: N2-1u-62
  couleur: rouge
  role: '+5 V : douille VC vers rail N2 col. 1'
- n: 12
  de: N2-1u-61
  vers: N1-1u-61
  couleur: rouge
  role: lien du rail +5 V N2 vers N1
- n: 13
  de: MASSE.main
  vers: TOP-L1-1
  couleur: turquoise
  role: '0 V : douille MASSE vers bus haut'
cables:
- id: A
  nom: BNC–BNC
  de: gbf.sync_out
  vers: BNC1
  role: SYNC du GBF -> CLK de la bascule
- id: B
  nom: BNC–BNC depuis le T
  de: gbf.sync_out
  vers: scope.ch1
  via: T
  role: 'voie 1 : affiche l''horloge'
- id: C
  nom: BNC–BNC
  de: scope.ch2
  vers: BNC2
  role: 'voie 2 : Q'
- id: D
  nom: câble banane
  de: psu.ch1_plus
  vers: VC
  role: +5 V (voie 1 +) -> douille VC
- id: E
  nom: câble banane
  de: psu.ch1_moins
  vers: MASSE
  role: 0 V (voie 1 −) -> douille MASSE
tee:
  sur: gbf.sync_out
  statut: a_confirmer
  preuve: T à poser sur la sortie SYNC ; sinon, mesure l'horloge sur la voie 1 avec une sonde sur la broche 3
noeuds:
  CLK:
  - BNC1.core
  - T1g48
  - U1.3
  Q:
  - U1.5
  - BNC2.core
  - T1i46
  - R.a
  - T1h46
  QB:
  - U1.6
  - U1.2
  - T1g49
  - T1g45
  VCC:
  - U1.14
  - U1.1
  - U1.4
  - VC.main
  - N1-1u-50
  - N1-1u-47
  - N2-1u-50
  GND:
  - U1.7
  - T1f44
  - TOP-L1-5
  - BNC1.shield
  - BNC2.shield
  - TOP-L1-3
  - TOP-L1-4
  - LED.k
  - T1h56
  - TOP-L1-6
  - MASSE.main
  - TOP-L1-1
etapes_montage:
- Retire la puce 74LS00 (A2) ; pose le 74LS74, encoche en haut, broche 1 en T1j50.
- 'Alim : broche 14 → +5 V, broche 7 → 0 V (fils 8, 9). CLR et PRE à +5 V (fils 5, 6) — OBLIGATOIRE.'
- 'Fil 7 : Q̄ → D (T1g49 ↔ T1g45). R 330 Ω T1h46 → T1h52, LED T1i52/T1i56.'
- 'Horloge : SYNC du GBF → BNC 1 → broche 3. Voie 2 sur Q (T1i46).'
- 'tpd : base de temps 20 ns/div, trigger voie 1 front montant, mesurer à 1,5 V : ≈ 15–25 ns (datasheet 25 ns typ).'
precedent: montages/tp3/A2_seuils.yaml
instruments:
  psu:
    photo: psu_ports
    reglages: Voie 1 = 5,00 V (6 V max) · limite 0,1 A · ON après câblage
    etapes:
    - n: 1
      cible: ch1_plus
      texte: 'Voie 1 : régler 5,00 V, limite de courant 0,1 A'
    - n: 2
      cible: btn_on_1
      texte: 'ON : lire 5,00 V à l''écran'
  gbf:
    photo: gbf_ports
    reglages: Carré 0–5 V (5 Vpp, offset 2,5 V) · 1 kHz pour la LED… SYNC = TTL
    etapes:
    - n: 1
      cible: btn_waveform
      texte: Waveform puis la forme voulue
    - n: 2
      cible: btn_parameter
      texte: 'Parameter : Frequency / Amplitude / Offset'
    - n: 3
      cible:
      - keypad_1
      - keypad_0
      - keypad_dot
      texte: 'Pavé : 1 kHz (puis 1 MHz pour le tpd). La sortie SYNC est un TTL 0–5 V'
    - n: 4
      cible: btn_ch1_setup
      texte: 'Setup (Channel 1) : charge High Z — chemin exact à vérifier sur l''appareil'
    - n: 5
      cible: btn_ch1_onoff
      texte: 'On/Off (Channel 1) : ON'
  scope:
    photo: scope_front
    reglages: 'Voie 1 : 2 V/div (CLK) · voie 2 : 2 V/div (Q) · 200 µs/div, puis 20 ns/div pour tpd'
    etapes:
    - n: 1
      cible: btn_default_setup
      texte: Default Setup
    - n: 2
      cible:
      - btn_ch1
      - btn_ch2
      texte: Voies 1 et 2 allumées, couplage DC, sonde 1:1
    - n: 3
      cible: knob_horiz
      texte: Base de temps selon le montage
    - n: 4
      cible: btn_trig_menu
      texte: 'Trigger : source voie 1, front montant'
    - n: 5
      cible: btn_meas
      texte: 'Meas : Cr-cr voies 1 et 2, fréquence ; curseurs si besoin'
pannes:
- 'Q reste à 0 : CLR (broche 1) non relié au +5 V.'
- 'Q ne bascule pas : D relié à Q (broche 5) au lieu de Q̄ (broche 6).'
- 'Pas d''horloge : sortie SYNC non activée, ou câble sur OUT1.'
