# Test de fidélité : photo scope_tp2_b.jpg (triangle dissymétrique à « pic » + carré avec ondulations, curseurs et mesures).
titre: "Photo B — triangle à pic + carré, mesures Cr-cr et phase"
photo: {file: scope_tp2_b.jpg, crop: [165, 250, 740, 420]}
vue: {rotateY: 3, rotate: 0}
tdiv: 0.0002
trig: {src: 1, level: "-3.04V"}
